<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S2팀 일정 캘린더</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <!-- SheetJS (엑셀 파싱용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fc { --fc-border-color: #e2e8f0; --fc-button-bg-color: #059669; --fc-button-border-color: #059669; --fc-button-hover-bg-color: #047857; --fc-button-hover-border-color: #047857; --fc-button-active-bg-color: #065f46; --fc-today-bg-color: #f0fdf4; }
        .fc-theme-standard th { background-color: #f8fafc; padding: 8px 0; font-weight: 600; color: #334155; }
        .fc-event { cursor: pointer; border: none; padding: 2px 4px; font-size: 11px; font-weight: 600; border-radius: 4px; }
        .fc-daygrid-day-number { color: #475569; font-weight: 500; font-size: 12px; padding: 8px !important; }
        .fc-header-toolbar { margin-bottom: 1.5rem !important; }
        
        .fc-toolbar-title { font-size: 1.25rem !important; font-weight: 700; color: #0f172a; cursor: pointer; transition: color 0.2s; }
        .fc-toolbar-title:hover { color: #059669; }
        
        .holiday-event { text-align: center; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .fc-list-event-time { display: none !important; }

        .fc-day-sat { background-color: rgba(239, 246, 255, 0.6) !important; } 
        .fc-day-sun { background-color: rgba(254, 242, 242, 0.6) !important; } 

        .fc-col-header-cell.fc-day-sat { color: #2563eb !important; }
        .fc-col-header-cell.fc-day-sun { color: #dc2626 !important; }

        .fc-theme-standard .fc-day-today { 
            background-color: #ecfdf5 !important; 
            box-shadow: inset 0 0 0 2px #34d399 !important; 
        }
        .fc .fc-day-today .fc-daygrid-day-number {
            background-color: #10b981 !important;
            color: #ffffff !important;
            font-weight: 700;
            border-radius: 4px;
            padding: 3px 6px !important;
            margin: 4px;
        }

        .fc-daygrid-day-events {
            padding-bottom: 28px !important; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased selection:bg-emerald-600 selection:text-white relative">

    <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2.5 pointer-events-none"></div>

    <!-- 커스텀 우클릭 메뉴 -->
    <div id="custom-context-menu" class="fixed bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 w-36 z-[9999] hidden text-xs font-semibold text-slate-700">
        <button onclick="handleContextEdit()" class="w-full text-left px-3.5 py-2 hover:bg-slate-100 flex items-center space-x-2 text-slate-700">
            <i class="fa-solid fa-pen text-emerald-600"></i><span>일정 수정</span>
        </button>
        <button onclick="handleContextDelete()" class="w-full text-left px-3.5 py-2 hover:bg-slate-100 flex items-center space-x-2 text-rose-600">
            <i class="fa-solid fa-trash"></i><span>일정 삭제</span>
        </button>
    </div>

    <!-- 완전 분리된 독립형 확인 팝업 모달 -->
    <div id="custom-confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[99999] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-5 border border-slate-100 transform scale-100 transition-transform" id="custom-confirm-box">
            <div class="flex items-start space-x-4">
                <div class="bg-amber-100 text-amber-600 p-2.5 rounded-full shrink-0 mt-1">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-900 text-base mb-1">확인 필요</h3>
                    <p id="custom-confirm-msg" class="text-slate-600 text-sm whitespace-pre-line leading-relaxed"></p>
                </div>
            </div>
            <div class="flex items-center justify-end space-x-2 pt-2">
                <button id="custom-confirm-cancel" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">취소</button>
                <button id="custom-confirm-ok" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">확인</button>
            </div>
        </div>
    </div>

    <!-- 관리자 로그인 인증 모달 -->
    <div id="admin-login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[99999] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full p-6 space-y-4 border border-slate-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="bg-purple-100 text-purple-600 p-2 rounded-lg">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <h3 class="font-bold text-slate-900 text-sm">관리자 인증</h3>
                </div>
                <button onclick="closeAdminLoginModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleAdminLoginSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">아이디 (ID)</label>
                    <input type="text" id="admin-id-input" value="admin" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-500 font-medium focus:outline-none cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호 (PW)</label>
                    <input type="password" id="admin-pw-input" required placeholder="비밀번호를 입력하세요" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="flex items-center justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAdminLoginModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">취소</button>
                    <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">로그인</button>
                </div>
            </form>
        </div>
    </div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm shrink-0">
        <div class="max-w-[120rem] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                    <h1 onclick="handleHiddenTrigger(event)" class="font-bold text-base sm:text-lg text-slate-950 tracking-tight flex items-center space-x-2 cursor-default select-none">
                        <span>S2팀 통합 일정 캘린더</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div id="live-clock-container" class="flex items-center justify-center space-x-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700 shadow-inner w-[165px] tabular-nums" title="구글 서버 시간 기준 실시간 시계">
                    <i class="fa-regular fa-clock text-emerald-600"></i>
                    <span id="live-clock-text">--:--:--</span>
                </div>

                <div class="flex items-center space-x-2">
                    <div id="hidden-admin-buttons" class="hidden items-center space-x-2 bg-emerald-50/80 p-1.5 rounded-xl border border-emerald-200 animate-pulse">
                        <label class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5 cursor-pointer" title="엑셀 일정 덮어쓰기 업로드">
                            <i class="fa-solid fa-file-excel"></i>
                            <span class="hidden sm:inline">엑셀 업로드</span>
                            <input type="file" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                        </label>
                        <button id="undo-btn" onclick="undoExcelUpload()" disabled class="bg-amber-500 hover:bg-amber-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5" title="직전 엑셀 업로드 전 상태로 되돌립니다">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span class="hidden sm:inline">업로드 취소</span>
                        </button>
                        <button onclick="changeLockTimeoutSetting()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5" title="미리보기 고정 유지 시간 설정">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <span class="hidden sm:inline">고정 시간 설정</span>
                        </button>
                        <button onclick="resetCalendarData()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5" title="모든 일정을 초기화하고 공휴일만 남깁니다">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span class="hidden sm:inline">초기화</span>
                        </button>
                        <button onclick="hideAdminMenu()" class="bg-slate-500 hover:bg-slate-600 text-white text-xs font-semibold px-2.5 py-2 rounded-lg shadow-sm transition" title="관리자 메뉴 숨기기">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <a href="https://jeshu111.github.io/zesq-s2-onboarding/" class="bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5" title="S2팀 온보딩 포털">
                        <i class="fa-solid fa-house-laptop"></i>
                        <span class="hidden sm:inline">온보딩 포털</span>
                    </a>

                    <div class="relative" id="filter-container">
                        <button onclick="toggleFilterDropdown(event)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-filter text-emerald-600"></i>
                            <span class="hidden sm:inline">필터</span>
                        </button>
                        <div id="filter-dropdown" class="absolute right-0 mt-2 w-96 bg-white rounded-2xl shadow-xl border border-slate-200 p-5 z-40 hidden space-y-4" onclick="event.stopPropagation()">
                            <div>
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
                                    <span class="text-xs font-bold text-slate-800">제목 검색 필터</span>
                                </div>
                                <div>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                        </span>
                                        <input type="text" id="filter-title-input" oninput="renderCalendarData()" placeholder="일정 제목에 포함된 단어 검색..." class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
                                    <span class="text-xs font-bold text-slate-800">휴가 필터</span>
                                    <div class="space-x-1.5">
                                        <button onclick="selectAllFilters('leave', true)" class="text-[11px] text-blue-600 hover:underline">선택</button>
                                        <button onclick="selectAllFilters('leave', false)" class="text-[11px] text-rose-500 hover:underline">해제</button>
                                    </div>
                                </div>
                                <div id="filter-leave-checkboxes" class="space-y-1 text-xs pr-1"></div>
                            </div>

                            <div>
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
                                    <span class="text-xs font-bold text-slate-800">담당자별 필터</span>
                                    <div class="space-x-1.5">
                                        <button onclick="selectAllFilters('member', true)" class="text-[11px] text-blue-600 hover:underline">전체</button>
                                        <button onclick="selectAllFilters('member', false)" class="text-[11px] text-rose-500 hover:underline">해제</button>
                                    </div>
                                </div>
                                <div class="mb-2.5">
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                        </span>
                                        <input type="text" id="filter-search-input" oninput="filterMemberCheckboxes()" placeholder="담당자 또는 그룹 검색..." class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    </div>
                                </div>
                                <div id="filter-member-checkboxes" class="max-h-72 overflow-y-auto space-y-1.5 text-xs pr-1"></div>
                            </div>
                        </div>
                    </div>

                    <button onclick="openMemberModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-users-gear"></i>
                        <span class="hidden sm:inline">조직 관리</span>
                    </button>
                    <button onclick="openEventModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 sm:px-4 py-2 rounded-lg shadow-sm transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>일정 등록</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 🌟 수정된 부분: 달력(왼쪽)과 미리보기(오른쪽)의 레이아웃 순서 변경 -->
    <main class="flex-1 max-w-[120rem] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-6 overflow-hidden">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex-1 w-full max-w-5xl h-full flex flex-col overflow-hidden relative">
            <div id="calendar" class="h-full"></div>
            <div id="loading-spinner" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-10">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-500"></i>
            </div>
        </div>

        <aside class="w-full lg:w-80 shrink-0 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center space-x-2">
                    <div id="panel-indicator" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h2 class="font-bold text-slate-800 text-sm" id="left-panel-header-title">일정 실시간 미리보기</h2>
                </div>
                <button id="left-panel-unlock-btn" onclick="unlockPreview()" class="hidden text-rose-500 hover:text-rose-700 text-xs font-semibold flex items-center space-x-1 bg-rose-50 px-2 py-1 rounded-lg border border-rose-100 transition">
                    <i class="fa-solid fa-lock-open"></i> <span>고정 해제</span>
                </button>
            </div>
            <div id="preview-container" class="flex-1 flex flex-col justify-center items-center text-center p-6 text-slate-400 text-xs bg-slate-50 rounded-xl border border-dashed border-slate-200 overflow-y-auto">
                <i class="fa-regular fa-hand-pointer text-2xl mb-2 text-slate-300"></i>
                <p>캘린더의 일정에 마우스를 올리면 미리보기가 표시되며,<br><b>클릭하면 해당 미리보기가 고정</b>됩니다.</p>
            </div>
        </aside>
    </main>

    <div id="date-picker-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-xs w-full p-6 space-y-4 border border-slate-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-base">원하는 연도 및 월 선택</h3>
                <button onclick="closeDatePickerModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">연도</label>
                    <select id="picker-year" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">월</label>
                    <select id="picker-month" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                        <option value="0">1월</option><option value="1">2월</option><option value="2">3월</option>
                        <option value="3">4월</option><option value="4">5월</option><option value="5">6월</option>
                        <option value="6">7월</option><option value="7">8월</option><option value="8">9월</option>
                        <option value="9">10월</option><option value="10">11월</option><option value="11">12월</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="closeDatePickerModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">취소</button>
                <button type="button" onclick="applyDatePicker()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">이동</button>
            </div>
        </div>
    </div>

    <!-- 일정 추가/수정 모달 -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-base" id="modal-title">일정 등록</h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleEventSubmit(event)" class="space-y-3">
                <input type="hidden" id="event-id">
                
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">시작일</label>
                        <input type="date" id="f-start" onchange="onStartDateChange()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">종료일</label>
                        <input type="date" id="f-end" onchange="onEntityChange()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">일정 구분</label>
                        <select id="f-category" onchange="onEntityChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                            <option value="일반 업무">일반 업무</option>
                            <option value="휴가">휴가</option>
                            <option value="회의">회의</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">담당 주체</label>
                        <select id="f-member" onchange="onEntityChange()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                        </select>
                    </div>
                </div>

            setTimeout(() => { toast.classList.remove('opacity-0', 'translate-y-2'); }, 10);

                const btnOk = document.getElementById('custom-confirm-ok');

                const newCancel = btnCancel.cloneNode(true);
                btnOk.parentNode.replaceChild(newOk, btnOk);
                btnCancel.parentNode.replaceChild(newCancel, btnCancel);

                const cleanup = (result) => {
                    modal.classList.add('hidden');
                    resolve(result);
                };

                document.getElementById('custom-confirm-ok').onclick = () => cleanup(true);
                document.getElementById('custom-confirm-cancel').onclick = () => cleanup(false);

        function startLiveClock() {
            const updateClock = () => {
                const estimatedServerTimeMs = Date.now() + (window.serverTimeOffset || 0);

                const month = String(now.getMonth() + 1).padStart(2, '0');

                const seconds = String(now.getSeconds()).padStart(2, '0');

        window.handleExcelUpload = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });

                const partColorMap = {
                    'All(전체 인원)': '#10b981', 'Cloud Potal': '#2563eb', 'OnCloud': '#059669',
                    'Health Pro': '#7c3aed', 'OnCAFE': '#ea580c'
                };

                const headers = rows[0]; 
                let currentPart = null;
                let memberPartMap = {};
                let newMembersSet = new Set();
                let newGroupsSet = new Set();
                
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    const p = row[0];
                    const m = row[1];
                    if (p && String(p).trim() !== '') {
                        currentPart = String(p).trim();
                        newGroupsSet.add(currentPart);
                    }
                    if (m && String(m).trim() !== '' && m !== '공휴일 목록' && !String(m).startsWith('2026')) {
                        const mName = String(m).trim();
                        memberPartMap[mName] = currentPart || '기타';
                        newMembersSet.add(mName);
                    }
                }

                newMembersSet.forEach(name => {
                    if(!teamMembers.some(tm => tm.name === name)) {
                        push(membersRef, { name: name, isResigned: false });
                    }
                });

                newGroupsSet.forEach(gName => {
                    if(!teamGroups.some(tg => tg.name === gName)) {
                        const assignedColor = partColorMap[gName] || '#059669';
                        push(groupsRef, { name: gName, color: assignedColor, members: [] });
                    }
                });

                const existingEventMap = new Map();
                if (rawCalendarData) {
                    Object.entries(rawCalendarData).forEach(([key, item]) => {
                        const sig = `${item.start}_${item.member}_${item.title}`.trim();
                        existingEventMap.set(sig, key);
                    });
                }

                const individualEvents = [];
                const groupedEvents = {};

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    const m = row[1];
                    if (!m || String(m).trim() === '' || m === '공휴일 목록' || String(m).startsWith('2026')) continue;

                    const name = String(m).trim();
                    const part = memberPartMap[name] || '기타';
                    const matchedGroupObj = teamGroups.find(g => g.name === part);
                    const groupColor = matchedGroupObj ? matchedGroupObj.color : (partColorMap[part] || '#059669');

                    for (let c = 2; c < headers.length; c++) {
                        const val = row[c];
                        if (val && String(val).trim() !== '') {
                            let dateStr = null;
                            const headerVal = headers[c];

                            if (typeof headerVal === 'number') {
                                const d = XLSX.SSF.parse_date_code(headerVal);
                                dateStr = `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
                            } else if (typeof headerVal === 'string') {
                                const match = headerVal.match(/(\d+)\/(\d+)/);
                                if (match) {
                                    dateStr = `2026-${match[1].padStart(2, '0')}-${match[2].padStart(2, '0')}`;
                                } else if (headerVal.includes('-')) {
                                    dateStr = headerVal.split(' ')[0];
                                }
                            }

                            if (dateStr) {
                                const title = String(val).trim();
                                let dObj = new Date(dateStr);
                                dObj.setDate(dObj.getDate() + 1);
                                let endDateStr = dObj.toISOString().split('T')[0];
                                
                                const tempItem = { title: title };
                                if (isLeaveEvent(tempItem)) {
                                    individualEvents.push({
                                        member: name, title: title, start: dateStr, end: endDateStr,
                                        category: '휴가', color: '#475569', comment: '엑셀 휴가 등록', url: '', subMembers: []
                                    });
                                } else {
                                    const key = `${dateStr}_${title}_${part}`; 
                                    if (!groupedEvents[key]) {
                                        groupedEvents[key] = {
                                            start: dateStr, end: endDateStr, title: title, part: part, color: groupColor,
                                            members: new Set()
                                        };
                                    }
                                    groupedEvents[key].members.add(name);
                                }
                            }
                        }
                    }
                }

                const updates = {};
                let processedCount = 0;

                Object.values(groupedEvents).forEach(evt => {
                    const membersArr = Array.from(evt.members);
                    let assignMember = evt.part === 'All' ? 'All(전체 인원)' : evt.part;
                    let subMembers = [];
                    let commentTxt = "👥 엑셀 자동 등록";
                    
                    if (membersArr.length > 1) {
                        assignMember = evt.part === 'All' ? 'All(전체 인원)' : evt.part; 
                        subMembers = membersArr; 
                        commentTxt = `👥 엑셀 파싱: 총 ${membersArr.length}명 공통 일정`;
                    }

                    const sig = `${evt.start}_${assignMember}_${evt.title}`.trim();
                    const eventData = {
                        member: assignMember, title: evt.title, start: evt.start, end: evt.end,
                        category: '일반 업무', color: evt.color, comment: commentTxt, url: "", subMembers: subMembers
                    };

                    let targetKey = existingEventMap.get(sig);
                    if (!targetKey) targetKey = push(calendarRef).key;
                    updates['s2_team_calendar/' + targetKey] = eventData;
                    processedCount++;
                });

                individualEvents.forEach(evt => {
                    const sig = `${evt.start}_${evt.member}_${evt.title}`.trim();
                    let targetKey = existingEventMap.get(sig);
                    if (!targetKey) targetKey = push(calendarRef).key;
                    updates['s2_team_calendar/' + targetKey] = evt;
                    processedCount++;
                });

                if (processedCount > 0) {
                    if (await showConfirm(`엑셀 파일에서 총 ${processedCount}건의 일정을 독립 일정으로 파싱했습니다.\n반영하시겠습니까?`)) {
                        lastBackupData = rawCalendarData ? JSON.parse(JSON.stringify(rawCalendarData)) : {};
                        document.getElementById('undo-btn').removeAttribute('disabled');
                        update(ref(db), updates).then(() => {
                            e.target.value = '';
                            showToast('엑셀 데이터가 성공적으로 반영되었습니다.', 'success');
                        }).catch(err => {
                            showToast('반영 중 오류가 발생했습니다.', 'error');
                        });
                    } else {
                        e.target.value = '';
                    }
                } else {
                    showToast('파싱된 일정이 없습니다.', 'error');
                    e.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        };

                    const scoreA = getScore(a);

                    if (scoreA !== scoreB) return scoreA - scoreB;
                    
                    const titleA = (a.extendedProps.rawTitle || a.title).toLowerCase();

        function isWebUrl(str) {
            if (!str) return false;
            let u = str.trim().toLowerCase();
            return u.startsWith('http://') || u.startsWith('https://') || u.startsWith('www.');
        }

        function formatWebUrl(rawUrl) {
            if (!rawUrl) return '#';
            let u = rawUrl.trim();
            if (u.startsWith('www.')) {
                return 'http://' + u;
            }
            return u;
        }

        function renderPreviewBox(evt) {
            const previewContainer = document.getElementById('preview-container');
            if (!previewContainer) return;

            const isHoliday = (evt.source && evt.source.id === 'korea-holidays');
            const title = evt.extendedProps.rawTitle || evt.title;
            const category = evt.extendedProps.category || '일반 업무';
            const member = evt.extendedProps.member || (isHoliday ? '공휴일' : '강인현');
            const startStr = evt.startStr.split('T')[0];
            
            let endStr = startStr;
            if (evt.end) {
                const endDate = new Date(evt.endStr);
                endDate.setDate(endDate.getDate() - 1);
                endStr = endDate.toISOString().split('T')[0];
                if (endStr < startStr) endStr = startStr;
            }

            const comment = evt.extendedProps.comment || '등록된 코멘트가 없습니다.';
            const urlData = evt.extendedProps.url || '';
            const subMembers = evt.extendedProps.subMembers || [];
            const isGroup = teamGroups.some(g => g.name === member);

            let subListHtml = '';
            if (isGroup && subMembers.length > 0) {
                subListHtml = `<div class="mt-2 pt-2 border-t border-slate-100"><span class="font-semibold text-slate-500 block mb-1">참여 인원 (${subMembers.length}명)</span><p class="text-slate-700 text-[11px] leading-relaxed">${subMembers.join(', ')}</p></div>`;
            } else if (!isGroup && !isHoliday) {
                subListHtml = `<div class="mt-2 pt-2 border-t border-slate-100"><span class="font-semibold text-slate-500 block mb-1">담당자</span><p class="text-slate-700 text-[11px]">${member}</p></div>`;
            }

            let urlHtml = '';
            if (urlData) {
                const lines = urlData.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length > 0) {
                    urlHtml = `<div class="mt-2 pt-2 border-t border-slate-100 space-y-1.5"><span class="font-semibold text-slate-500 block">관련 링크</span>`;
                    lines.forEach((line) => {
                        let linkTitle = "관련 링크";
                        let linkVal = line;
                        
                        if (line.includes('|')) {
                            const parts = line.split('|');
                            linkTitle = parts[0].trim();
                            linkVal = parts[1].trim();
                        }

                        if (isWebUrl(linkVal)) {
                            const safeHref = formatWebUrl(linkVal);
                            urlHtml += `
                                <a href="${safeHref}" target="_blank" class="block bg-blue-50/60 hover:bg-blue-100/60 border border-blue-100 p-2 rounded-lg transition text-[11px]">
                                    <div class="font-bold text-blue-800 flex items-center space-x-1">
                                        <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                        <span>${linkTitle}</span>
                                    </div>
                                    <div class="text-blue-600 truncate mt-0.5">${linkVal}</div>
                                </a>`;
                        } else {
                            const escapedVal = linkVal.replace(/\\/g, '\\\\');
                            urlHtml += `
                                <div class="bg-slate-50 border border-slate-200 p-2 rounded-lg flex items-center justify-between text-[11px] gap-2">
                                    <div class="overflow-hidden flex-1">
                                        <div class="font-bold text-slate-700">${linkTitle}</div>
                                        <div class="text-slate-500 truncate mt-0.5 select-all" title="로컬 경로">${linkVal}</div>
                                    </div>
                                    <button type="button" onclick="copyToClipboard('${escapedVal}')" class="shrink-0 bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 w-7 h-7 rounded flex items-center justify-center transition" title="경로 복사">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </div>`;
                        }
                    });
                    urlHtml += `</div>`;
                }
            }

            if (lockedEventId === evt.id) {
                document.getElementById('left-panel-header-title').innerText = "고정된 일정 정보";
                document.getElementById('panel-indicator').className = "w-2 h-2 rounded-full bg-purple-500 animate-ping";
                document.getElementById('left-panel-unlock-btn').classList.remove('hidden');
            }

            let badgeHtml = `<span class="px-2 py-0.5 rounded text-[10px] font-bold text-white shadow-sm" style="background-color: ${evt.backgroundColor || '#059669'};">${member}</span>`;
            if (!isHoliday && category) {
                badgeHtml = `
                    <div class="flex items-center space-x-1.5">
                        ${badgeHtml}
                        <span class="text-[10px] text-slate-500 font-semibold bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">${category}</span>
                    </div>
                `;
            }

            previewContainer.className = "flex-1 flex flex-col justify-between items-stretch text-left p-4 text-xs bg-white rounded-xl border border-emerald-300 shadow-sm transition-all";
            previewContainer.innerHTML = `
                <div class="w-full space-y-2 overflow-y-auto pr-1">
                    <div class="flex items-center justify-between">
                        ${badgeHtml}
                        <span class="text-[10px] text-slate-400 shrink-0 ml-2">${startStr}${startStr !== endStr ? ' ~ ' + endStr : ''}</span>
                    </div>
                    <h3 class="font-bold text-slate-900 text-sm leading-snug">${title}</h3>
                    <p class="text-slate-600 text-[11px] bg-slate-50 p-2.5 rounded-lg border border-slate-100 whitespace-pre-line">${comment}</p>
                    ${subListHtml}
                    ${urlHtml}
                </div>
                ${!isHoliday ? `
                <div class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
                    <button onclick="editEventFromPreview('${evt.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-sm transition flex items-center space-x-1">
                        <i class="fa-solid fa-pen text-[10px]"></i> <span>수정</span>
                    </button>
                    <button onclick="deleteEventFromPreview('${evt.id}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg transition flex items-center space-x-1">
                        <i class="fa-solid fa-trash text-[10px]"></i> <span>삭제</span>
                    </button>
                </div>` : ''}
            `;
        }

        window.editEventFromPreview = function(eventId) {
            const evt = calendar.getEventById(eventId);
            if (!evt) return;

            document.getElementById('modal-title').innerText = "일정 수정";
            document.getElementById('event-id').value = evt.id;
            
            let catValue = evt.extendedProps.category;
            if (!catValue) {
                if(evt.extendedProps.rawTitle && (evt.extendedProps.rawTitle.includes('연차') || evt.extendedProps.rawTitle.includes('반차'))) catValue = '휴가';
                else catValue = '일반 업무';
            }
            document.getElementById('f-category').value = catValue;
            
            const titleVal = evt.extendedProps.rawTitle || evt.title;
            document.getElementById('f-title').value = titleVal;
            
            if (catValue === '휴가') {
                document.getElementById('leave-type-section').classList.remove('hidden');
                const cleanTitle = titleVal.replace(/\s+/g, '');
                
                document.querySelectorAll('input[name="leave-type"]').forEach(r => {
                    if (r.value === '오전 반차' && cleanTitle.includes('오전반차')) {
                        r.checked = true;
                    } else if (r.value === '오후 반차' && cleanTitle.includes('오후반차')) {
                        r.checked = true;
                    } else if (r.value === '연차' && cleanTitle.includes('연차')) {
                        r.checked = true;
                    } else {
                        r.checked = false;
                    }
                });
            } else {
                document.getElementById('leave-type-section').classList.add('hidden');
                document.querySelectorAll('input[name="leave-type"]').forEach(r => r.checked = false);
            }

            const assignedEntity = evt.extendedProps.member || '강인현';
            const memberSelect = document.getElementById('f-member');
            
            if(!Array.from(memberSelect.options).some(opt => opt.value === assignedEntity)) {
                const tempOpt = document.createElement('option');
                tempOpt.value = assignedEntity;
                tempOpt.dataset.color = evt.backgroundColor;
                tempOpt.textContent = assignedEntity + " (삭제됨)";
                memberSelect.appendChild(tempOpt);
            }
            memberSelect.value = assignedEntity;
            
            document.getElementById('f-start').value = evt.startStr.split('T')[0];
            
            if (evt.end) {
                const endDate = new Date(evt.endStr);
                endDate.setDate(endDate.getDate() - 1);
                const calculatedEndStr = endDate.toISOString().split('T')[0];
                const startStr = evt.startStr.split('T')[0];
                document.getElementById('f-end').value = (calculatedEndStr < startStr) ? startStr : calculatedEndStr;
            } else {
                document.getElementById('f-end').value = evt.startStr.split('T')[0];
            }

            onStartDateChange(); 

            const subMembers = evt.extendedProps.subMembers || [];
            document.querySelectorAll('.sub-member-cb').forEach(cb => {
                cb.checked = subMembers.includes(cb.value);
            });
            
            document.getElementById('f-comment').value = evt.extendedProps.comment || '';
            
            const urlData = evt.extendedProps.url || '';
            const linkItems = [];
            if (urlData) {
                urlData.split('\n').forEach(line => {

            } else {

                document.querySelectorAll('input[name="leave-type"]').forEach(r => r.checked = false);
            }

            container.innerHTML = '';

            if (selectEl.options[selectEl.selectedIndex]) {
                if (categoryVal === '휴가') {
                    selectEl.options[selectEl.selectedIndex].dataset.color = '#475569';
                } else {
                    const matchedGroup = teamGroups.find(g => g.name === selectedVal);
                    if (matchedGroup) {
                        selectEl.options[selectEl.selectedIndex].dataset.color = matchedGroup.color;
                    } else {
                        selectEl.options[selectEl.selectedIndex].dataset.color = '#059669';
                    }
                }
            }

            const matchedGroup = teamGroups.find(g => g.name === selectedVal);
            if (matchedGroup && matchedGroup.members && matchedGroup.members.length > 0) {
                subSection.classList.remove('hidden');

                const startStr = document.getElementById('f-start').value;
                const endStr = document.getElementById('f-end').value;
                const currentEditingId = document.getElementById('event-id').value;

                let membersWithConflict = new Set();
                if (rawCalendarData && startStr && endStr) {
                    const [sY, sM, sD] = startStr.split('-').map(Number);
                    const sDate = new Date(sY, sM - 1, sD);
                    const [eY, eM, eD] = endStr.split('-').map(Number);
                    const eDate = new Date(eY, eM - 1, eD);

                    Object.keys(rawCalendarData).forEach(key => {
                        if (key === currentEditingId) return;
                        const evt = rawCalendarData[key];
                        
                        const [evSY, evSM, evSD] = evt.start.split('-').map(Number);
                        const evStart = new Date(evSY, evSM - 1, evSD);
                        const evEndRaw = evt.end ? evt.end : evt.start;
                        const [evEY, evEM, evED] = evEndRaw.split('-').map(Number);
                        const evEnd = new Date(evEY, evEM - 1, evED);
                        
                        if (sDate <= evEnd && eDate >= evStart) {
                            if (teamMembers.some(m => m.name === evt.member)) membersWithConflict.add(evt.member);
                            if (evt.subMembers && Array.isArray(evt.subMembers)) {
                                evt.subMembers.forEach(sm => membersWithConflict.add(sm));
                            }
                        }
                    });
                }

                matchedGroup.members.forEach(mName => {
                    const hasConflict = membersWithConflict.has(mName);
                    const isChecked = !hasConflict; 
                    const lbl = document.createElement('label');
                    lbl.className = `flex items-center space-x-1 px-2 py-1 rounded border text-xs cursor-pointer transition ${hasConflict ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-white border-slate-200 hover:bg-slate-100 text-slate-700'}`;

        window.renderCalendarData = function() {
            if (!calendar) return;
            const oldSource = calendar.getEventSourceById('firebase-data');
            if (oldSource) oldSource.remove();

            if (rawCalendarData) {
                const titleInput = document.getElementById('filter-title-input');
                const titleKeyword = titleInput ? titleInput.value.trim().toLowerCase() : '';
                
                const anyMemberSelected = selectedMembers.size > 0;

                const eventsArray = Object.keys(rawCalendarData).reduce((arr, key) => {
                    const item = rawCalendarData[key];
                    const isLeave = isLeaveEvent(item);
                    
                    if (titleKeyword && (!item.title || !item.title.toLowerCase().includes(titleKeyword))) {
                        return arr;
                    }
                    
                    if (!anyMemberSelected && !showLeaveEvent) { 
                        arr.push(createCalendarEventObject(key, item)); 
                        return arr; 
                    }

                    let match = false;
                    if (showLeaveEvent && isLeave) match = true;
                    if (anyMemberSelected) {
                        if (selectedMembers.has(item.member)) match = true;
                        if (item.subMembers && Array.isArray(item.subMembers)) {
                            if (item.subMembers.some(sm => selectedMembers.has(sm))) match = true;
                        }
                    }
                    
                    if (match) arr.push(createCalendarEventObject(key, item));
                    return arr;
                }, []);
                
                calendar.addEventSource({ id: 'firebase-data', events: eventsArray });
            }
        };

        function createCalendarEventObject(key, item) {
            const isLeave = isLeaveEvent(item);
            
            let assignedCategory = item.category || '일반 업무';
            if (isLeave) assignedCategory = '휴가';

            let eventColor = item.color || '#059669';
            if (isLeave) {
                eventColor = '#475569';
            } else {
                const matchedGroup = teamGroups.find(g => g.name === item.member);
                if (matchedGroup) eventColor = matchedGroup.color;
            }

            let validEnd = item.end;
            if (item.start === item.end) {
                let dObj = new Date(item.start);
                dObj.setDate(dObj.getDate() + 1);
                validEnd = dObj.toISOString().split('T')[0];
            }

            return {
                id: key, title: `[${item.member}] ${item.title}`, start: item.start, end: validEnd, allDay: true,
                backgroundColor: eventColor, borderColor: eventColor,
                extendedProps: {
                    member: item.member, rawTitle: item.title, category: assignedCategory, 
                    comment: item.comment || '', url: item.url || '', subMembers: item.subMembers || [],
                    groupId: item.groupId || null
                }
            };
        }

            if(btn) selectColor(color, btn);
            const groupTarget = teamGroups.find(g => g.id === id);
            document.querySelectorAll('.group-member-cb').forEach(cb => { cb.checked = groupTarget && groupTarget.members ? groupTarget.members.includes(cb.value) : false; });
            document.getElementById('group-save-btn').innerText = '수정완료'; document.getElementById('group-cancel-btn').classList.remove('hidden');
        };

        window.cancelEditGroup = function() {
            editingGroupId = null; document.getElementById('new-group-name').value = '';
            document.getElementById('group-save-btn').innerText = '그룹 추가'; document.getElementById('group-cancel-btn').classList.add('hidden');
            document.querySelectorAll('.group-member-cb').forEach(cb => cb.checked = false);
            selectColor('#059669', document.querySelector('#group-color-palette .color-btn[data-color="#059669"]'));
        };

        window.saveGroup = function() {
            const name = document.getElementById('new-group-name').value.trim();
            if(!name) return showToast('그룹명을 입력하세요.', 'error'); 
            if(name === 'All' || name === 'All(전체 인원)') return showToast('해당 그룹명은 예약어입니다.', 'error');
            if(teamGroups.some(g => g.name === name && g.id !== editingGroupId)) return showToast('이미 존재하는 그룹명입니다.', 'error');
            const checkedMembers = Array.from(document.querySelectorAll('.group-member-cb:checked')).map(cb => cb.value);
            const groupData = { name, color: selectedGroupColor, members: checkedMembers };
            if(editingGroupId) update(ref(db, 's2_team_groups/' + editingGroupId), groupData); else push(groupsRef, groupData);
            cancelEditGroup();
            showToast('그룹 정보가 저장되었습니다.', 'success');
        };

        window.deleteGroup = async function(id) {
            const targetGroup = teamGroups.find(g => g.id === id || g.name === id);
            if (targetGroup && (targetGroup.name === 'All(전체 인원)' || targetGroup.name === 'All')) return showToast('해당 그룹은 삭제 불가입니다.', 'error');
            if (await showConfirm('이 그룹을 삭제하시겠습니까?')) {
                remove(ref(db, 's2_team_groups/' + id));
                if(editingGroupId === id) cancelEditGroup();
                showToast('그룹이 삭제되었습니다.', 'success');
            }
        };

        function updateEventDates(event) {
            const dbRef = ref(db, 's2_team_calendar/' + event.id);
            const endDate = event.end ? event.endStr.split('T')[0] : event.startStr.split('T')[0];
            update(dbRef, { start: event.startStr.split('T')[0], end: endDate });
        }

        window.openEventModal = function() {
            document.getElementById('modal-title').innerText = "일정 등록"; document.getElementById('event-id').value = "";
            document.getElementById('f-title').value = ""; document.getElementById('f-comment').value = "";
            document.getElementById('f-category').value = "일반 업무";
            
            renderUrlFields([{ title: '', url: '' }]);

            const selectEl = document.getElementById('f-member');
            if (selectEl.options.length > 0) selectEl.selectedIndex = 0;
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('f-start').value = today; document.getElementById('f-end').value = today;
            onStartDateChange();
            document.getElementById('modal-delete-btn').classList.add('hidden'); document.getElementById('event-modal').classList.remove('hidden');
        };

        window.closeEventModal = function() { document.getElementById('event-modal').classList.add('hidden'); };

        window.handleEventSubmit = function(e) {
            e.preventDefault();
            const id = document.getElementById('event-id').value; 
            const memberSelect = document.getElementById('f-member');
            if(memberSelect.value === "") return showToast('담당 주체를 선택해주세요.', 'error');
            
            const member = memberSelect.value; 
            const category = document.getElementById('f-category').value;
            const title = document.getElementById('f-title').value;
            
            let color = '#059669';
            if (category === '휴가') { 
                color = '#475569'; 
            } else {
                const matchedGroup = teamGroups.find(g => g.name === member);
                if (matchedGroup) { 
                    color = matchedGroup.color; 
                } else if (memberSelect.options[memberSelect.selectedIndex] && memberSelect.options[memberSelect.selectedIndex].dataset.color) { 
                    color = memberSelect.options[memberSelect.selectedIndex].dataset.color; 
                }
            }

            const comment = document.getElementById('f-comment').value; 
            
            const rows = document.querySelectorAll('#url-fields-container .flex-col');
            const urlLines = [];
            rows.forEach(row => {
                const tVal = row.querySelector('.url-title-input').value.trim();
                const uVal = row.querySelector('.url-input-item').value.trim();
                if (uVal !== '') {
                    const finalTitle = tVal !== '' ? tVal : '관련 링크';
                    urlLines.push(`${finalTitle}|${uVal}`);
                }
            });
            const url = urlLines.join('\n');

            const startStr = document.getElementById('f-start').value;
            const endInputStr = document.getElementById('f-end').value;
            const subMembers = Array.from(document.querySelectorAll('.sub-member-cb:checked')).map(cb => cb.value);

            const [sY, sM, sD] = startStr.split('-').map(Number);
            let currDate = new Date(sY, sM - 1, sD);
            const [eY, eM, eD] = endInputStr.split('-').map(Number);
            let lastDate = new Date(eY, eM - 1, eD);

            if (id) {
                let endObj = new Date(eY, eM - 1, eD + 1);
                const end = endObj.toISOString().split('T')[0];

                const eventData = { member, title, category, comment, url, start: startStr, end, color, subMembers };
                if (rawCalendarData && rawCalendarData[id] && rawCalendarData[id].groupId) {
                    eventData.groupId = rawCalendarData[id].groupId;
                }
                
                update(ref(db, 's2_team_calendar/' + id), eventData).then(() => {
                    showToast('일정이 수정되었습니다.', 'success');
                });
                closeEventModal();
                return;
            }
            
            let createdCount = 0;
            const updates = {};
            const groupId = 'grp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

            while (currDate <= lastDate) {
                const year = currDate.getFullYear();
                const month = String(currDate.getMonth() + 1).padStart(2, '0');
                const day = String(currDate.getDate()).padStart(2, '0');
                const dateString = `${year}-${month}-${day}`;

                const dayOfWeek = currDate.getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const isHoliday = holidayDatesSet.has(dateString);

                if (!isWeekend && !isHoliday) {
                    let nextDayObj = new Date(year, currDate.getMonth(), currDate.getDate() + 1);
                    const nextDayStr = nextDayObj.toISOString().split('T')[0];

                    const newRef = push(calendarRef);
                    updates[newRef.key] = {
                        member, title, category, comment, url,
                        start: dateString,
                        end: nextDayStr,
                        color, subMembers,
                        groupId: groupId
                    };
                    createdCount++;
                }

                currDate.setDate(currDate.getDate() + 1);
            }

            if (createdCount === 0) {
                return showToast('기간 내 평일(근무일)이 없어 생성 불가합니다.', 'error');
            }

            update(calendarRef, updates).then(() => {
                showToast(`총 ${createdCount}건의 평일 일정이 등록되었습니다.`, 'success');
                closeEventModal();
            }).catch(err => {
                showToast('일정 등록 중 오류 발생', 'error');
            });
        };

        window.handleEventDelete = async function() {
            const id = document.getElementById('event-id').value;
            if (!id) return;
            
            closeEventModal();
            await new Promise(r => setTimeout(r, 100));

            const confirmed = await showConfirm('이 일정을 삭제하시겠습니까?');
            if (!confirmed) return;

            await new Promise(r => setTimeout(r, 100));

            const evtData = rawCalendarData ? rawCalendarData[id] : null;
            let deleteKeys = [id];
            
            if (evtData && evtData.groupId) {
                const siblings = Object.keys(rawCalendarData).filter(k => rawCalendarData[k].groupId === evtData.groupId && k !== id);
                if (siblings.length > 0) {
                    const deleteGroupConfirmed = await showConfirm(`이 일정은 다중일(연속)로 등록된 일정입니다.\n이어진 나머지 ${siblings.length}개 일정도 함께 삭제하시겠습니까?\n\n* [확인]: 연결된 일정 모두 삭제\n* [취소]: 현재 선택한 일정만 삭제`);
                    if (deleteGroupConfirmed) {
                        deleteKeys = deleteKeys.concat(siblings);
                    }
                }
            }
            
            const updates = {};
            deleteKeys.forEach(k => updates['s2_team_calendar/' + k] = null);
            
            update(ref(db), updates).then(() => {
                showToast('일정이 삭제되었습니다.', 'success');
                if (lockedEventId && deleteKeys.includes(lockedEventId)) unlockPreview();
            });
        };
    </script>
</body>
</html>
